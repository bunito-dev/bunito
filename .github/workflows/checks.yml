name: Checks

on:
  workflow_call:

jobs:
  quality:
    name: Typecheck And Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun i --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

  tests:
    name: Test And Coverage
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun i --frozen-lockfile

      - name: Run tests
        run: |
          mkdir -p artifacts
          bun run test \
          --reporter=junit \
          --reporter-outfile=artifacts/test-results.xml

      - name: Enforce coverage
        run: |
          mkdir -p artifacts
          bun run coverage \
          --coverage-reporter=text \
          --coverage-reporter=lcov \
          --coverage-dir=artifacts/coverage-report
