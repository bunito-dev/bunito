name: PR

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/checks.yml
